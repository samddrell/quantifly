# QuantiFly v2.0 — legacy Python 2.7 runtime environment.
# Pins chosen so the old private imports still exist:
#   scipy.special._ufuncs_cxx   -> needs scipy < ~0.18
#   sklearn.utils.lgamma        -> needs scikit-learn < ~0.19
# conda-forge carries the last Python 2.7 / PyQt4 / vigra builds.
name: quantifly
channels:
  - conda-forge
dependencies:
  - python=2.7
  - pyqt=4
  - vigra
  - numpy=1.11
  - scipy=0.17
  - scikit-learn=0.17
  - matplotlib=1.5
  - pillow
